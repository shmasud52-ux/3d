
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Character Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #081321;
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  touch-action: none;
}

#panel {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 14px;
  background: #10243bd9;
  border: 1px solid #31516c;
  border-radius: 15px;
  z-index: 5;
  pointer-events: none;
}

#panel h2 {
  margin: 0 0 8px;
  font-size: 19px;
}

#status {
  font-size: 13px;
  color: #66e2ff;
  overflow-wrap: anywhere;
}

#help {
  margin-top: 7px;
  color: #bdcde0;
  font-size: 12px;
}

#buttons {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 5;
}

button {
  border: 1px solid #58d9ff;
  border-radius: 12px;
  background: #123b55eF;
  color: white;
  padding: 12px 16px;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="panel">
  <h2>3D Character Lab</h2>
  <div id="status">Checking 3D engine...</div>
  <div id="help">
    Drag to rotate • Pinch to zoom
  </div>
</div>

<div id="buttons">
  <button id="reset">Reset View</button>
  <button id="animation">Pause Animation</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const status = document.getElementById('status');

function showStatus(message) {
  status.textContent = message;
}

try {
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x081321);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    50, innerWidth / innerHeight, 0.1, 1000
  );

  camera.position.set(0, 1.8, 5);

  // Renderer
  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  document.body.appendChild(renderer.domElement);

  // Lighting
  scene.add(
    new THREE.HemisphereLight(0xffffff, 0x35435b, 2)
  );

  const light = new THREE.DirectionalLight(0xffffff, 2.5);
  light.position.set(4, 8, 5);
  scene.add(light);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({
      color: 0x14263b,
      roughness: 0.85
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.03;
  scene.add(floor);

  // Grid
  const grid = new THREE.GridHelper(
    100, 100, 0x1584aa, 0x29415b
  );

  grid.position.y = 0;
  scene.add(grid);

  // Camera controls
  const controls = new OrbitControls(
    camera, renderer.domElement
  );

  controls.enableDamping = true;
  controls.target.set(0, 1, 0);
  controls.minDistance = 1;
  controls.maxDistance = 30;

  // Animation
  const clock = new THREE.Clock();
  let mixer = null;
  let model = null;
  let animationAction = null;
  let isPlaying = true;
  let originalCameraPosition = new THREE.Vector3(0, 1.8, 5);
  let originalTarget = new THREE.Vector3(0, 1, 0);

  // Load GLB
  showStatus('Loading character.glb...');

  const loader = new GLTFLoader();

  loader.load(
    './character.glb',

    function(gltf) {
      model = gltf.scene;

      // Compute model bounds
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        showStatus('ERROR: Model has invalid dimensions.');
        return;
      }

      // Center horizontally and put feet on floor
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      scene.add(model);

      // Fit camera to model size
      const height = size.y;
      const distance = Math.max(height * 2.2, 2.5);

      camera.position.set(
        0,
        height * 0.65,
        distance
      );

      controls.target.set(0, height * 0.5, 0);
      controls.update();

      originalCameraPosition.copy(camera.position);
      originalTarget.copy(controls.target);

      // Start available animation
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);

        const walkAnimation = gltf.animations.find(
          clip => /walk/i.test(clip.name)
        );

        const clip = walkAnimation || gltf.animations[0];

        animationAction = mixer.clipAction(clip);
        animationAction.play();

        showStatus(
          'SUCCESS: Model loaded. Animation: ' + clip.name
        );
      } else {
        showStatus(
          'MODEL LOADED. No embedded animation found.'
        );

        document.getElementById('animation').disabled = true;
      }
    },

    function(xhr) {
      if (xhr.total > 0) {
        const percent = Math.round(
          xhr.loaded / xhr.total * 100
        );

        showStatus('Loading character: ' + percent + '%');
      }
    },

    function(error) {
      console.error('GLB load failed:', error);

      showStatus(
        'ERROR: Could not load character.glb. Check file path and server.'
      );
    }
  );

  // Reset camera
  document.getElementById('reset').addEventListener(
    'click', function() {
      camera.position.copy(originalCameraPosition);
      controls.target.copy(originalTarget);
      controls.update();
    }
  );

  // Pause / resume animation
  document.getElementById('animation').addEventListener(
    'click', function() {
      if (!animationAction) return;

      isPlaying = !isPlaying;
      animationAction.paused = !isPlaying;

      this.textContent = isPlaying
        ? 'Pause Animation'
        : 'Play Animation';
    }
  );

  // Render loop
  function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (mixer && isPlaying) {
      mixer.update(delta);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  // Responsive screen
  window.addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch (error) {
  console.error(error);

  showStatus(
    'ENGINE ERROR: ' + (error.message || 'Unknown error')
  );
}
</script>

</body>
</html>
