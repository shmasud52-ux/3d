<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Character Lab</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10141d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 { margin: 18px 0 8px; }

#status {
  color: #72f1c4;
  font-size: 14px;
  padding: 10px;
}

#viewer {
  display: block;
  width: 100%;
  height: 65vh;
  touch-action: none;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 12px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: #72f1c4;
  color: #10141d;
  font-weight: bold;
}

button:active { transform: scale(.96); }
</style>
</head>

<body>
<h2>3D Character Lab</h2>
<div id="status">Starting 3D engine...</div>

<canvas id="viewer"></canvas>

<div class="controls">
  <button onclick="playAnimation('Idle')">Idle</button>
  <button onclick="playAnimation('Walking')">Walk</button>
  <button onclick="playAnimation('Running')">Run</button>
  <button onclick="playAnimation('Jump')">Jump</button>
  <button onclick="resetView()">Reset View</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, controls;
let mixer = null;
let model = null;
let actions = {};
let activeAction = null;
let clock;
let jumpAction = null;

const status = document.getElementById("status");
const canvas = document.getElementById("viewer");

function startApp() {
  try {
    if (!window.THREE) {
      throw new Error("Three.js failed to load. Check internet.");
    }

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10141d);

    camera = new THREE.PerspectiveCamera(
      45,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.5, 4.5);

    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      canvas.clientWidth,
      canvas.clientHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.target.set(0, 0.9, 0);
    controls.enableDamping = true;
    controls.update();

    scene.add(new THREE.HemisphereLight(
      0xffffff, 0x444455, 2
    ));

    const light = new THREE.DirectionalLight(
      0xffffff, 2
    );

    light.position.set(4, 7, 5);
    scene.add(light);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({
        color: 0x202838,
        roughness: 0.9
      })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    scene.add(floor);

    clock = new THREE.Clock();

    if (!THREE.GLTFLoader) {
      throw new Error("GLTFLoader failed to load.");
    }

    status.textContent = "Loading animated character...";

    const loader = new THREE.GLTFLoader();

    loader.load(
      "https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb",

      function(gltf) {
        model = gltf.scene;
        scene.add(model);

        mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach(function(clip) {
          actions[clip.name] = mixer.clipAction(clip);
        });

        jumpAction = actions["Jump"];

        if (!actions["Idle"]) {
          status.textContent =
            "Model loaded, but Idle animation is missing.";
          return;
        }

        mixer.addEventListener("finished", function(event) {
          if (event.action === jumpAction) {
            playAnimation("Idle");
          }
        });

        playAnimation("Idle");

        status.textContent =
          "SUCCESS: Animated character loaded!";

      },

      function(progress) {
        if (progress.total > 0) {
          status.textContent =
            "Loading: " +
            Math.round(progress.loaded / progress.total * 100) +
            "%";
        }
      },

      function(error) {
        console.error(error);
        status.textContent =
          "ERROR: Model download failed. Check internet.";
      }
    );

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", function() {
      camera.aspect =
        canvas.clientWidth / canvas.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        canvas.clientWidth,
        canvas.clientHeight
      );
    });

  } catch (error) {
    status.textContent = "ERROR: " + error.message;
    console.error(error);
  }
}

function playAnimation(name) {
  if (!mixer || !actions[name]) {
    if (mixer) {
      status.textContent =
        "Animation not found: " + name;
    }
    return;
  }

  const nextAction = actions[name];

  if (activeAction === nextAction) {
    if (name === "Jump") {
      nextAction.reset().play();
    }
    return;
  }

  if (activeAction) {
    activeAction.fadeOut(0.2);
  }

  nextAction.reset();
  nextAction.enabled = true;
  nextAction.setEffectiveTimeScale(1);
  nextAction.setEffectiveWeight(1);

  if (name === "Jump") {
    nextAction.setLoop(THREE.LoopOnce, 1);
    nextAction.clampWhenFinished = true;
  } else {
    nextAction.setLoop(THREE.LoopRepeat, Infinity);
    nextAction.clampWhenFinished = false;
  }

  nextAction.fadeIn(0.2).play();
  activeAction = nextAction;

  status.textContent = "Playing: " + name;
}

function resetView() {
  if (!camera || !controls) return;

  camera.position.set(0, 1.5, 4.5);
  controls.target.set(0, 0.9, 0);
  controls.update();
}

window.addEventListener("load", startApp);
</script>
</body>
</html>
