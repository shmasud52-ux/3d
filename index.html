<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Character Lab</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10141d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  padding: 16px;
  text-align: center;
}

#status {
  color: #72f1c4;
  font-size: 14px;
  padding: 8px;
}

#viewer {
  width: 100%;
  height: 72vh;
  display: block;
}

button {
  padding: 12px 18px;
  margin: 5px;
  border: 0;
  border-radius: 10px;
  background: #72f1c4;
  color: #10141d;
  font-weight: bold;
}

.controls {
  text-align: center;
}
</style>
</head>

<body>
<header>
  <h2>3D Character Lab</h2>
  <div id="status">Loading 3D engine...</div>
</header>

<canvas id="viewer"></canvas>

<div class="controls">
  <button onclick="resetView()">Reset View</button>
  <button onclick="toggleAnimation()">Pause / Play</button>
</div>

<script>
function showError(message) {
  document.getElementById("status").textContent = message;
}
</script>

<script
  src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
  onerror="showError('ERROR: Three.js library failed to load')">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
  onerror="showError('ERROR: OrbitControls failed to load')">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"
  onerror="showError('ERROR: GLTFLoader failed to load')">
</script>

<script>
let scene, camera, renderer, controls;
let character = null;
let mixer = null;
let clock = null;
let animationPlaying = true;

function startApp() {
  if (!window.THREE) {
    showError("ERROR: Three.js is not available. Check internet.");
    return;
  }

  if (!THREE.GLTFLoader || !THREE.OrbitControls) {
    showError("ERROR: 3D components failed to load. Refresh page.");
    return;
  }

  try {
    const canvas = document.getElementById("viewer");

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10141d);

    camera = new THREE.PerspectiveCamera(
      45,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      1000
    );

    camera.position.set(0, 1.5, 5);
    camera.lookAt(0, 1, 0);

    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      canvas.clientWidth,
      canvas.clientHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.update();

    scene.add(new THREE.HemisphereLight(
      0xffffff, 0x444455, 2
    ));

    const light = new THREE.DirectionalLight(
      0xffffff, 2
    );
    light.position.set(4, 7, 5);
    scene.add(light);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({
        color: 0x202838,
        roughness: 0.85
      })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    scene.add(floor);

    clock = new THREE.Clock();

    showError("3D engine ready. Loading character...");

    const loader = new THREE.GLTFLoader();

    loader.load(
      "./character.glb",

      function(gltf) {
        character = gltf.scene;

        const box = new THREE.Box3().setFromObject(character);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        if (size.y > 0) {
          character.scale.setScalar(2.2 / size.y);
        }

        character.position.x -= center.x *
          (2.2 / (size.y || 1));
        character.position.z -= center.z *
          (2.2 / (size.y || 1));

        const newBox = new THREE.Box3().setFromObject(character);
        character.position.y -= newBox.min.y;

        scene.add(character);

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(character);
          gltf.animations.forEach(function(clip) {
            mixer.clipAction(clip).play();
          });
          showError("SUCCESS: Model loaded with animation!");
        } else {
          showError("SUCCESS: Model loaded. No animation found.");
        }
      },

      function(progress) {
        if (progress.total > 0) {
          const percent = Math.round(
            progress.loaded / progress.total * 100
          );
          showError("Loading character: " + percent + "%");
        }
      },

      function(error) {
        showError(
          "ERROR: Could not load character.glb. Check filename and folder."
        );
        console.error(error);
      }
    );

    function animate() {
      requestAnimationFrame(animate);

      if (mixer && animationPlaying) {
        mixer.update(clock.getDelta());
      } else {
        clock.getDelta();
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", function() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

  } catch (error) {
    showError("ERROR: " + error.message);
    console.error(error);
  }
}

function resetView() {
  if (!camera || !controls) return;

  camera.position.set(0, 1.5, 5);
  controls.target.set(0, 1, 0);
  controls.update();
}

function toggleAnimation() {
  animationPlaying = !animationPlaying;
}

window.addEventListener("load", function() {
  setTimeout(startApp, 300);
});
</script>
</body>
</html>
